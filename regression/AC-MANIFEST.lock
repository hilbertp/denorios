      "text": "a branch with zero commits ahead of the integration branch still fails verification with the existing no-commits reason",
      "acHash": "sha256:2203ba7486a7a086162e3dfc4068556b900ca31cb5bdcdc343da1c2d6ebc49da",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-2": {
      "slice": "375",
      "text": "a branch with one commit that changes at least one file outside the bookkeeping paths passes verification, decided from the diff rather than the report",
      "acHash": "sha256:d0fc52e37e3e94d478131522a418bd7db12fefa8a058eaf47564544670298c27",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-3": {
      "slice": "375",
      "text": "a branch whose commits change only the DONE report fails with a distinct reason naming the absence of a product change",
      "acHash": "sha256:2bfeb0423c80dec8e346be4ff570e3cd5f17fba3588e8aff5214f4219815d1a0",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-4": {
      "slice": "375",
      "text": "the self-reported token count is no longer able to fail a slice, and the claimed-versus-actual divergence still appears as a warning",
      "acHash": "sha256:e5df61a9766d3c5fb5f6534c3fa26dba65ea06858bbdc762b09eca00964b548b",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-5": {
      "slice": "375",
      "text": "no failure message claims there are no commits when the branch has one",
      "acHash": "sha256:cea49fb58eeef9175d0d21ba1e7b772e06ec490ce5ddf30e4fab6628637b0a31",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-6": {
      "slice": "375",
      "text": "the verification function keeps its existing name and signature",
      "acHash": "sha256:5c2d774d14e8a6377fdc227636fb590507840948e9fe677be2062112c812e6e1",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-375-ac-7": {
      "slice": "375",
      "text": "a test runs the new rule against the existing single-commit branch slice/371 and it passes without that commit being changed",
      "acHash": "sha256:4c53cf94d41440f0ae8309cd10090aa774ce38081ef43aa0cac1a03e77d85f29",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-376-ac-1": {
      "slice": "376",
      "text": "a newly created slice workspace has its dependencies available immediately after creation, without any manual step",
      "acHash": "sha256:6a3e93cb09290862898859e84a55c4a84e1ed098822d6c979614e58987cc81fb",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-376-ac-2": {
      "slice": "376",
      "text": "a fresh workspace can run the safety-net suite and can list the browser suite",
      "acHash": "sha256:6e6f7b809a108ecd4bf3682f64f322e20cffd313e860f7bdd79eea5b9955b79f",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-376-ac-3": {
      "slice": "376",
      "text": "git status in a fresh workspace is clean, and the dependency directory cannot be committed",
      "acHash": "sha256:88379708bca6022c35bd2aa6b6ba2b07c4e87481138421b690e40ce99027fb55",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-376-ac-4": {
      "slice": "376",
      "text": "no browser download occurs per slice; the existing machine-wide cache is used",
      "acHash": "sha256:0ed0ae2330ee797d53c08877b0784d5a6a846af515916d7944d8b3ed9cae2bae",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-376-ac-5": {
      "slice": "376",
      "text": "the reviewer's workspace is provisioned the same way as the implementer's",
      "acHash": "sha256:821694680608016dfc35b296d765cefc16f22dd2c5fd30e54923fcdd726cbacf",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-379-ac-1": {
      "slice": "379",
      "text": "criterion text is taken from immutable commit history rather than from working files that can be renamed or deleted",
      "acHash": "sha256:8dd1883e49fa0fd5a37acd536aebffe580303172f57de744ee63f9ff8e8c5687",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-379-ac-2": {
      "slice": "379",
      "text": "archiving a slice, renaming its queue file, or deleting it from the working tree leaves the manifest unchanged",
      "acHash": "sha256:7e0434a4b9f94c61c9bacf1163e9e62f62802818c84532f2e97771b2d9c48937",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-379-ac-3": {
      "slice": "379",
      "text": "every criterion that resolves as active today still resolves as active, and the legacy count does not grow",
      "acHash": "sha256:89a49d6b5d91e31bba03666d386f2e3939b53b213c3327886d680abab97fb750",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-379-ac-4": {
      "slice": "379",
      "text": "a criterion whose text was amended across commits resolves to the newest declaration",
      "acHash": "sha256:91b66583b30f7f61296131874031f46324632b7401b60d4cb8838f99ee765724",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
    "slice-379-ac-5": {
      "slice": "379",
      "text": "the manifest integrity and determinism guards still pass",
      "acHash": "sha256:80a2be997538d1e071cdb54efdb5d487adc525909c991a3801ae2089b5a9cd80",
      "source": "commit-trailer",
      "status": "active",
      "legacy": false
    },
