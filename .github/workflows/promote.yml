name: Promote dev to main

# dev = staging, main = prod (ADR-GITHUB-CI-MERGE-MODEL).
#
# Promotion is OPERATOR-GATED. Nothing auto-promotes anymore. Per the user
# story "see RR, decide when to run the regression suite and merge", the
# operator looks at the release-risk score on the dashboard and triggers this
# workflow deliberately — via the dashboard's Promote button (POST
# /api/promote/dispatch) or `gh workflow run promote.yml --ref dev`.
#
# When dispatched, this workflow re-runs the FULL regression set against exactly
# the dev SHA being promoted — BOTH the fast node:test suite (regression/) AND
# the expensive Playwright browser click-paths (e2e/) — and fast-forwards main to
# that commit ONLY if EVERYTHING is green. A red suite (regression OR e2e) fails
# the job and main is untouched — that IS the gate. main is never merged unless
# the regression suite is fully green (Philipp, 2026-06-13). Both suites run in
# this one job against a single checkout, so the SHA tested is exactly the SHA
# promoted. ci.yml still runs the fast suite on every dev push for early warning;
# it no longer runs the browser e2e on push and it never triggers promotion.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gate-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Step 1 of the gate is UPDATE TESTS. The suites below test intended behaviour,
      # so if any commit in this promotion changed behaviour on purpose, the regression
      # & e2e tests must already have been updated to match — otherwise the suites fail
      # by design (a stale test, not a real regression). This step surfaces exactly what
      # changed so a stale-test failure is unambiguous. It never pushes and has no escape
      # hatch, so it cannot move main.
      - name: Update tests — what changed in this promotion
        run: |
          echo "::group::Update tests — files changed between origin/main and the dev commit being promoted"
          git fetch origin main --depth=1 || true
          git diff --stat origin/main...HEAD || true
          echo ""
          echo "Reminder: regression/ + e2e/ test INTENDED behaviour. If any of the commits above"
          echo "changed behaviour on purpose, the tests must already be updated to match — update"
          echo "them BEFORE running the gate, not after the suites below catch a stale test."
          echo "::endgroup::"

      # The ENFORCING half of step 1: the signed Test-Update Gate. It classifies the
      # exact promoted changeset (base = merge-base(origin/main, HEAD), head = HEAD,
      # two-dot) and FAILS CLOSED on a RED FLAG — a check loosened/removed/skipped, new
      # behaviour shipped untested, or the COVERAGE.lock guard count shrunk — unless an
      # auditable override trailer (Test-Loosen-OK / Tests-Not-Needed / Coverage-Removed)
      # declares it intentional. No error-suppression escape hatch: a RED verdict stops
      # the gate BEFORE the suites run, so a masked regression can't ride a loosened
      # test to green. (The j-gate-fail-retry guard forbids the literal escape-hatch key.)
      - name: Test-Update Gate (verdict — fail closed on RED)
        run: |
          set -euo pipefail
          git fetch origin main dev
          node scripts/tests-needed.js --strict
          # AC-reconcile completeness (ADR-AC-RECONCILE). The AC hash-diff already rides inside
          # --strict above (AC-MUTATED/AC-RETIRED with no AC-Change-OK + Spec-Owner). This
          # surfaces any in-window MISSING/STALE. Advisory in v1 (exits 0 on the legacy
          # baseline); set AC_CUSTODY_ENFORCE=1 to make AC custody RED-blocking (§11.1) — then
          # an AC-vs-test conflict halts the promotion here and escalates to Philipp.
          node scripts/ac-reconcile.js

      - name: Run regression gate (fast node:test suite)
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
          echo "Running regression suite against dev@$TESTED_SHA"
          node --test 'regression/**/*.test.js'

      # The expensive browser click-paths are part of the merge gate, not just
      # per-push feedback: main does not move unless these are green too. Same job,
      # same checkout ⇒ exactly the TESTED_SHA above is what gets exercised + promoted.
      - name: Install dependencies (browser e2e gate)
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e gate (Playwright click-paths)
        run: |
          set -euo pipefail
          echo "Running browser e2e suite against dev@$TESTED_SHA"
          npx playwright test

      - name: Fast-forward main to the tested commit
        run: |
          set -euo pipefail
          echo "Regression + browser e2e green on dev@$TESTED_SHA — promoting to main"
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            git push origin "$TESTED_SHA:refs/heads/main"
            echo "main promoted to $TESTED_SHA"
          else
            echo "::error::main diverged from dev; $TESTED_SHA is not a fast-forward of main. Reconcile dev/main."
            exit 1
          fi
