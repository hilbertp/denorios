name: CI

# Regression gate for the dev → main model (docs/adr/ADR-GITHUB-CI-MERGE-MODEL.md).
# Runs BASHIR'S REGRESSION SUITE (regression/) — his behavioral gate, which he authors
# and grows per use case. The fast unit gate (job `test`) is pure Node, no install step.
#
# Job `e2e` is a SEPARATE, heavier job: real Playwright browser clicktests of the Ops
# dashboard (e2e/). The expensive browser suite is the MERGE GATE — it runs inside
# promote.yml and main is never promoted unless it is green (Philipp, 2026-06-13).
# Here it does NOT run on every dev push (it would block the hot loop / a workstation
# for ~30 min); it runs only on pull_request to main and on manual workflow_dispatch,
# as an optional pre-gate dry run. The fast regression suite (`test`) stays per-push
# for early warning.
#
# NOTE: test/ (the orchestrator's own unit/integration tests) is intentionally NOT in the
# prod gate yet — much of it is slow integration and tests the local-merge internals being
# retired by this migration. Harden + re-include it after the orchestrator rework. See ADR.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: node --test (regression/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Bashir's regression suite
        run: |
          set -o pipefail
          mkdir -p bridge/state
          node --test 'regression/**/*.test.js' 2>&1 | tee bridge/state/regression-stdout.log

      # Always turn the run into a readable report (what regressed), even when the
      # gate above is red — this is Bashir's feedback to the engineering team.
      - name: Regression report
        if: always()
        run: |
          node scripts/regression-report.js --from-log || true
          {
            echo "## Bashir's Regression Report";
            echo "";
            cat regression/LAST-RUN.md;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression/LAST-RUN.md
          if-no-files-found: ignore

  # ── Browser e2e (Playwright) — separate, heavier job; parallel to the unit gate. ──
  # Drives the REAL dashboard frontend against a deterministic fixture backend
  # (e2e/seed-fixture.js). No real claude/Terminal/git/merge side effects.
  e2e:
    name: playwright e2e (Ops dashboard journeys)
    runs-on: ubuntu-latest
    # The browser suite is the merge gate (promote.yml). Don't burn ~30 min on it
    # for every dev push — only on PRs to main and manual dispatch.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
